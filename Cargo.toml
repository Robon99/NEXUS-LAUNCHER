[package]
name = "nexus-launcher"
version = "0.2.0"
edition = "2021"
description = "A Rust Minecraft Java Edition launcher with isolated instances"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
directories = "6.0"
hex = "0.4"
md-5 = "0.10"
open = "5.3"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
slint = "1.18.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
